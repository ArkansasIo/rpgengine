<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0d2b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#0066ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bannerBg)"/>
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50"/><line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="100" y1="0" x2="100" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/><line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>
  <!-- Circuit traces -->
  <g stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.15">
    <polyline points="50,150 150,150 180,120 280,120"/>
    <polyline points="900,80 1000,80 1050,130 1150,130"/>
    <polyline points="200,220 350,220 380,250 500,250"/>
    <circle cx="280" cy="120" r="3" fill="#00d4ff"/>
    <circle cx="1150" cy="130" r="3" fill="#00d4ff"/>
    <circle cx="500" cy="250" r="3" fill="#00d4ff"/>
  </g>
  <!-- Accent line -->
  <rect x="100" y="145" width="1000" height="2" fill="url(#accent)" rx="1"/>
  <!-- Title -->
  <text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" letter-spacing="3">ArcLight Engine API</text>
  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6699bb" letter-spacing="6">DOCUMENTATION &amp; REFERENCE</text>
  <!-- Version badge -->
  <rect x="520" y="200" width="160" height="30" rx="15" fill="#00d4ff" opacity="0.15"/>
  <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#00d4ff" letter-spacing="2">VERSION 1.0.0</text>
</svg>
