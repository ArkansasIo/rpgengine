<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000011;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <!-- Arc of light -->
  <path d="M200,280 Q400,80 600,280" stroke="url(#arcGrad)" stroke-width="8" fill="none" filter="url(#glow)"/>
  <path d="M220,270 Q400,100 580,270" stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- A letter -->
  <text x="400" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" filter="url(#glow)">A</text>
  <!-- Engine text -->
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#00d4ff" letter-spacing="8">ARCLIGHT ENGINE</text>
  <!-- Subtitle -->
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#668899" letter-spacing="4">UE5-INSPIRED GAME ENGINE</text>
  <!-- Decorative dots -->
  <circle cx="150" cy="100" r="2" fill="#00d4ff" opacity="0.3"/>
  <circle cx="650" cy="120" r="2" fill="#00d4ff" opacity="0.3"/>
  <circle cx="100" cy="300" r="1.5" fill="#0066ff" opacity="0.4"/>
  <circle cx="700" cy="280" r="1.5" fill="#0066ff" opacity="0.4"/>
</svg>
