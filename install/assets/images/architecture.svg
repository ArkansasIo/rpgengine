<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050810;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a40;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1520;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="700" fill="url(#bg2)"/>
  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#00d4ff" letter-spacing="4">ARCLIGHT ENGINE ARCHITECTURE</text>
  <line x1="200" y1="55" x2="800" y2="55" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <!-- Core row -->
  <rect x="350" y="80" width="300" height="60" rx="8" fill="url(#boxGrad)" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">CORE ENGINE</text>
  <!-- Subsystem boxes row 1 -->
  <rect x="50" y="200" width="160" height="50" rx="6" fill="url(#boxGrad)" stroke="#00aaff" stroke-width="1"/>
  <text x="130" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">ECS System</text>
  <rect x="240" y="200" width="160" height="50" rx="6" fill="url(#boxGrad)" stroke="#00aaff" stroke-width="1"/>
  <text x="320" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">Gameplay GAS</text>
  <rect x="430" y="200" width="160" height="50" rx="6" fill="url(#boxGrad)" stroke="#00aaff" stroke-width="1"/>
  <text x="510" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">Niagara Particles</text>
  <rect x="620" y="200" width="160" height="50" rx="6" fill="url(#boxGrad)" stroke="#00aaff" stroke-width="1"/>
  <text x="700" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">Chaos Physics</text>
  <rect x="810" y="200" width="140" height="50" rx="6" fill="url(#boxGrad)" stroke="#00aaff" stroke-width="1"/>
  <text x="880" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">Behavior Trees</text>
  <!-- Subsystem boxes row 2 -->
  <rect x="100" y="300" width="180" height="50" rx="6" fill="url(#boxGrad)" stroke="#0088cc" stroke-width="1"/>
  <text x="190" y="330" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">RTS World System</text>
  <rect x="320" y="300" width="180" height="50" rx="6" fill="url(#boxGrad)" stroke="#0088cc" stroke-width="1"/>
  <text x="410" y="330" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">Save / Load / Quest</text>
  <rect x="540" y="300" width="180" height="50" rx="6" fill="url(#boxGrad)" stroke="#0088cc" stroke-width="1"/>
  <text x="630" y="330" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">Factions / Trade</text>
  <rect x="760" y="300" width="180" height="50" rx="6" fill="url(#boxGrad)" stroke="#0088cc" stroke-width="1"/>
  <text x="850" y="330" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">Blueprint System</text>
  <!-- UI row -->
  <rect x="200" y="420" width="250" height="50" rx="6" fill="url(#boxGrad)" stroke="#006699" stroke-width="1"/>
  <text x="325" y="450" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">Stellaris-Style UI</text>
  <rect x="500" y="420" width="250" height="50" rx="6" fill="url(#boxGrad)" stroke="#006699" stroke-width="1"/>
  <text x="625" y="450" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">UE5-Style Editor UI</text>
  <!-- Settings row -->
  <rect x="300" y="520" width="400" height="50" rx="6" fill="url(#boxGrad)" stroke="#004466" stroke-width="1"/>
  <text x="500" y="550" text-anchor="middle" font-family="Arial" font-size="13" fill="#00d4ff">Settings: Graphics | Audio | Input | Display | KeyBindings</text>
  <!-- Connection lines -->
  <g stroke="#00d4ff" stroke-width="1" opacity="0.3" fill="none">
    <line x1="500" y1="140" x2="130" y2="200"/><line x1="500" y1="140" x2="320" y2="200"/>
    <line x1="500" y1="140" x2="510" y2="200"/><line x1="500" y1="140" x2="700" y2="200"/>
    <line x1="500" y1="140" x2="880" y2="200"/>
    <line x1="130" y1="250" x2="190" y2="300"/><line x1="320" y1="250" x2="410" y2="300"/>
    <line x1="510" y1="250" x2="630" y2="300"/><line x1="700" y1="250" x2="850" y2="300"/>
    <line x1="190" y1="350" x2="325" y2="420"/><line x1="410" y1="350" x2="325" y2="420"/>
    <line x1="630" y1="350" x2="625" y2="420"/><line x1="850" y1="350" x2="625" y2="420"/>
    <line x1="325" y1="470" x2="500" y2="520"/><line x1="625" y1="470" x2="500" y2="520"/>
  </g>
  <!-- Developer credit -->
  <text x="500" y="630" text-anchor="middle" font-family="Arial" font-size="12" fill="#445566">Developer: Stephen | UE5-Inspired Architecture</text>
  <text x="500" y="660" text-anchor="middle" font-family="Arial" font-size="11" fill="#334455">RTS | 4X Space | MMORPG Hybrid Engine</text>
</svg>
